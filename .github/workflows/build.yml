name: build
on:
  schedule:
    - cron: "0 6 * * 1"        # Mondays 06:00 UTC
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE*"]
  workflow_dispatch:
concurrency: build
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: cache/*.zip
          key: usda-${{ hashFiles('sources.json') }}
      - run: echo "RELEASE_TAG=data-$(date -u +%Y%m%d)-${{ github.run_number }}" >> "$GITHUB_ENV"
      - run: pytest -q --ignore=tests/test_smoke.py
      - run: python community.py
      - run: python build.py            # manifest URLs point at this tag's release assets, never `latest`
      - run: pytest -q tests/test_smoke.py
      # A draft first, so `releases/latest` never points at a release whose assets are still uploading.
      - name: Publish a GitHub Release
        run: |
          gh release create "$RELEASE_TAG" out/*.zip out/manifest.json --draft \
            --title "Food database $RELEASE_TAG" \
            --notes "Built from Open Food Facts (ODbL) and USDA FoodData Central (public domain). See manifest.json."
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Keep only the newest two releases
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^data-' | sort -rV | tail -n +3 \
            | xargs -r -n1 gh release delete --yes --cleanup-tag
